<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101b34">
    <title>轨道闪避 · Orbit Dash</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./engine.js"></script>
    <script defer src="./game.js"></script>
  </head>
  <body>
    <main class="game-shell">
      <div class="game-top"><span class="wordmark">ORBIT<span> DASH</span></span><span class="session-label">45 秒生存实验</span></div>
      <div class="hud" aria-label="游戏状态">
        <div><span>得分</span><output id="score">000</output></div>
        <div><span>剩余时间</span><output id="remaining">45<span class="unit">s</span></output></div>
        <div><span>护盾</span><output id="shields" aria-label="3 格护盾">● ● ●</output></div>
      </div>
      <div class="arena">
        <canvas id="canvas" width="512" height="512" tabindex="0" role="img" aria-label="轨道闪避游戏：用左右键沿星环移动，躲开陨石，收集黄色能量。"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card"><span class="overlay-label" id="overlay-label">KEEP YOUR ORBIT</span><h1 id="overlay-title">守住你的轨道。</h1><p id="overlay-description">躲开珊瑚色陨石，收集黄色能量。<br>三格护盾，坚持 45 秒就能通关。</p><button id="start-button">开始游戏 <span aria-hidden="true">↗</span></button><span class="start-hint" id="start-hint">← → / A D 移动 · 空格暂停</span></div>
        </div>
      </div>
      <div class="game-bottom"><div class="touch-buttons" role="group" aria-label="触控移动"><button id="move-left" aria-label="逆时针移动">←</button><button id="move-right" aria-label="顺时针移动">→</button></div><p class="controls-copy">← → / A D 移动 · 空格暂停<br><span>触屏：拖动飞船，或长按方向按钮</span></p><button id="pause-button" class="pause-button" disabled>暂停</button></div>
      <p class="legend"><span><i class="legend-ship"></i>你的飞船</span><span><i class="legend-rock"></i>避开陨石</span><span><i class="legend-energy"></i>能量 +50</span></p>
      <p id="announcement" class="sr-only" role="status" aria-live="polite">准备开始。</p>
    </main>
  </body>
</html>
